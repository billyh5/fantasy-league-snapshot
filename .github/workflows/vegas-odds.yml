name: Update NFL Vegas Props
on:
  workflow_dispatch:
  schedule:
    - cron: '13 11,15,19,23 * 9-12,1 *'
permissions:
  contents: write
concurrency:
  group: vegas-odds-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch player prop lines
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python scripts/fetch_vegas_odds.py
      - name: Publish key-free odds snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add odds/vegas_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NFL player prop odds'
            git push
          fi
